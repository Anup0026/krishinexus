<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Krishi Nexus - Real OTP Auth</title>
  <style>
    /* Basic toast notification styling */
    #toast {
      visibility: hidden;
      min-width: 250px;
      background-color: #333;
      color: #fff;
      text-align: center;
      border-radius: 4px;
      padding: 12px;
      position: fixed;
      z-index: 1000;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
    }
    #toast.show {
      visibility: visible;
      animation: fadein 0.5s, fadeout 0.5s 2.5s;
    }
    @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
    @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
  </style>
</head>
<body>

  <!-- Toast Notification Element -->
  <div id="toast"></div>

  <!-- Hidden file input for WhatsApp-style profile photo upload -->
  <input type="file" id="whatsappPhotoInput" accept="image/*" style="display:none;" onchange="handlePhotoUpload(event)">

  <script>
    // ==========================================
    // 1. API CONFIGURATION
    // ==========================================
    // Automatically switches between localhost for development and your live Render backend for production
    const API_BASE_URL = window.location.hostname === "localhost"
      ? "http://localhost:5000"
      : "https://your-render-app-name.onrender.com"; // <-- Replace with your actual Render backend URL

    // ==========================================
    // 2. MULTI-LANGUAGE DICTIONARY & STATE
    // ==========================================
    const I18N = {
      English: {
        sendOtp: "Send OTP",
        verifyOtp: "Verify & Save",
        otpPlaceholder: "6-digit OTP"
      },
      Hindi: {
        sendOtp: "OTP भेजें",
        verifyOtp: "OTP सत्यापित कर सेव करें",
        otpPlaceholder: "6-अंकों का OTP"
      }
    };

    let LANGUAGE = localStorage.getItem("kn_language") || "English";
    let currentPhotoUploadRole = "farmer";

    function t(key) {
      return (I18N[LANGUAGE] && I18N[LANGUAGE][key]) || I18N["English"][key] || key;
    }

    // ==========================================
    // 3. UTILITY FUNCTIONS (Toast & Avatar)
    // ==========================================
    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 3200);
    }

    function triggerPhotoUpload(role) {
      currentPhotoUploadRole = role;
      document.getElementById("whatsappPhotoInput").click();
    }

    function handlePhotoUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const base64Data = e.target.result;
        
        if (currentPhotoUploadRole === "farmer") {
          localStorage.setItem("kn_farmer_photo", base64Data);
          const display = document.getElementById("farmerAvatarDisplay");
          if (display) display.innerHTML = `<img src="${base64Data}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" alt="Farmer Profile">`;
          toast("Farmer profile photo updated successfully!");
        } else {
          localStorage.setItem("kn_labour_photo", base64Data);
          const display = document.getElementById("labourAvatarDisplay");
          if (display) display.innerHTML = `<img src="${base64Data}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" alt="Labour Profile">`;
          toast("Labour profile photo updated successfully!");
        }
      };
      reader.readAsDataURL(file);
    }

    // ==========================================
    // 4. REAL SMS OTP CLIENT FUNCTIONS
    // ==========================================

    /**
     * Sends a real SMS OTP request to the backend server via Fast2SMS
     */
    async function handleSendOtp(phoneNumber) {
      if (!phoneNumber || phoneNumber.length < 10) {
        toast("Please enter a valid 10-digit mobile number.");
        return;
      }

      try {
        toast("Sending real SMS OTP...");
        const response = await fetch(`${API_BASE_URL}/api/auth/send-otp`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phone: phoneNumber })
        });

        const data = await response.json();
        
        if (data.success) {
          toast("Real OTP sent successfully via SMS!");
          console.log("OTP Sent Response:", data);
        } else {
          toast(data.message || "Failed to send OTP.");
        }
      } catch (error) {
        console.error("Network Error (Send OTP):", error);
        toast("Network connection error. Please check your backend.");
      }
    }

    /**
     * Verifies the OTP entered by the user and logs them in / registers them
     */
    async function handleVerifyAndRegister(phoneNumber, enteredOtp, fullName, role) {
      if (!phoneNumber || !enteredOtp) {
        toast("Phone number and OTP are required.");
        return;
      }

      try {
        toast("Verifying OTP...");
        const response = await fetch(`${API_BASE_URL}/api/auth/verify-otp`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            phone: phoneNumber,
            otp: enteredOtp,
            fullName: fullName || "Krishi User",
            role: role || "farmer"
          })
        });

        const data = await response.json();

        if (data.success) {
          toast("Authentication successful!");
          // Save JWT token and user profile to local storage
          localStorage.setItem("kn_auth_token", data.token);
          localStorage.setItem("kn_user_profile", JSON.stringify(data.user));
          
          console.log("Logged in user:", data.user);
          // Redirect or reload dashboard here if needed
        } else {
          toast(data.message || "Invalid or expired OTP.");
        }
      } catch (error) {
        console.error("Network Error (Verify OTP):", error);
        toast("Verification failed due to network error.");
      }
    }

    // ==========================================
    // 5. INITIALIZATION
    // ==========================================
    document.addEventListener("DOMContentLoaded", () => {
      console.log("🌾 Krishi Nexus Client Engine loaded with Real SMS OTP support!");
    });
  </script>
</body>
</html>
